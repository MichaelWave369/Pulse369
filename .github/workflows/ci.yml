name: Pulse 369 checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, game, portal, build, Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Game and sensor checks
        run: node scripts/verify-game.mjs
      - name: Build browser and Worker
        run: pnpm run build
      - name: Build public React portal
        run: pnpm exec vite build --config portal/vite.config.ts
      - name: Quest calibration unit tests
        run: node --test portal/quest-math.test.mjs
      - name: Quest rhythm scheduling tests
        run: node --test portal/quest-rhythm.test.mjs
      - name: Local music file and Web Audio clock tests
        run: node --test portal/quest-local-music.test.mjs
      - name: Desktop rehearsal clock and privacy tests
        run: node --test portal/desktop-rhythm.test.mjs
      - name: QA receipt structure and provenance tests
        run: node --test portal/qa-compare.test.mjs
      - name: Manual Quest first-run provenance and gating tests
        run: node --test portal/quest-first-run.test.mjs
      - name: DanceFlow choreography, timing and privacy tests
        run: node --test portal/dance-core.test.mjs
      - name: Choreographer class timeline, audio guard and privacy tests
        run: node --test portal/dance-class.test.mjs
      - name: Choreography Creator chart import, mirror, timeline and privacy tests
        run: node --test portal/choreo-model.test.mjs
      - name: Motion Coach interpolation, reduced-motion and pose projection tests
        run: node --test portal/motion-coach.test.mjs
      - name: Dance Director style, boundary, expression and phrase cues tests
        run: node --test portal/dance-director.test.mjs
      - name: Dance Academy lessons, safe seated cues, and R2 export privacy tests
        run: node --test portal/dance-academy.test.mjs
      - name: Dance Workout Builder schedule, imports, recovery, hand-chart and privacy tests
        run: node --test portal/dance-workout.test.mjs
      - name: Dance Performance Studio scene, timing, import and privacy tests
        run: node --test portal/dance-performance.test.mjs
      - name: Worker integration checks
        run: node scripts/verify-studio.mjs
